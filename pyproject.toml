[project]
name = "planning-performance-analytics"
version = "0.1.0"
description = "Plataforma integrada de inteligência analítica, simulação de cenários paramétricos e controle estatístico de processos (CEP)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "faker>=30.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
]
